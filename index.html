                const wrongQs = questions.filter(q => wrongIds.includes(q.id));
                const baseURI = window.location.href.split('?')[0].split('#')[0].replace(/\/[^\/]*$/, '/');
                let htmlContent = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>錯題匯出 - 🌟 （114-1）7年級-生物：第一次段考練功（福和考古題） 🌟</title><base href="${baseURI}"><style>body{font-family:'Noto Sans TC',sans-serif;line-height:1.6;padding:20px;color:#333;max-width:800px;margin:0 auto;}h1{text-align:center;color:#0d9488;}.meta-info{text-align:center;color:#666;margin-bottom:30px;}.question-card{border:2px solid #e5e7eb;padding:20px;margin-bottom:25px;border-radius:12px;page-break-inside:avoid;}.q-title{font-weight:bold;font-size:1.3em;color:#0f766e;margin-bottom:15px;border-bottom:1px solid #e5e7eb;padding-bottom:10px;}.q-img{max-width:100%;max-height:250px;display:block;margin:15px auto;border:1px solid #ccc;}.options{margin-bottom:20px;}.option{padding:8px 12px;margin-bottom:5px;border-radius:6px;background-color:#f9fafb;}.correct{color:#16a34a;font-weight:bold;background-color:#f0fdf4;border:1px solid #bbf7d0;}.explanation{background:#fffbeb;padding:15px;border-radius:8px;border-left:5px solid #f59e0b;}.exp-title{font-weight:bold;color:#d97706;margin-bottom:8px;}@media print{body{padding:0;}.question-card{border:1px solid #999;page-break-inside:avoid;box-shadow:none;}}</style></head><body><h1>🌟 專屬錯題本 🌟</h1><div class="meta-info">測驗：🌟 （114-1）7年級-生物：第一次段考練功（福和考古題） 🌟<br>匯出時間：${new Date().toLocaleString('zh-TW')} | 總錯題數：${wrongQs.length} 題</div>`;
                wrongQs.forEach(q => {
                    htmlContent += `<div class="question-card"><div class="q-title">第 ${q.id} 題</div><div>${q.q}</div>${q.img ? `<img class="q-img" src="${q.img}" />` : ''}<div class="options">${q.opts.map((opt, idx) => `<div class="option ${idx === q.ans ? 'correct' : ''}">${idx === q.ans ? '✅ ' : '⬜ '}${opt}</div>`).join('')}</div><div class="explanation"><div class="exp-title">✨ 觀念大補帖：</div><div>${q.exp}</div></div></div>`;
                });
                htmlContent += `</body></html>`;
                if (type === 'html') {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([htmlContent], { type: 'text/html' }));
                    a.download = `錯題本_${new Date().getTime()}.html`;
                    a.click(); showToast("⬇️ HTML 檔案已下載！");
                } else if (type === 'pdf') {
                    const printWindow = window.open('', '_blank');
                    if (printWindow) { printWindow.document.write(htmlContent); printWindow.document.close(); printWindow.onload = () => { printWindow.focus(); printWindow.print(); }; } 
                    else showToast("❌ 無法開啟列印視窗，請允許瀏覽器彈出視窗！");
                }
            };

            const executeReset = () => {
                if (resetStep === 1) {
                    setAnswers({}); setWrongIds([]); setReviewAnswers({});
                    safeRemoveItem('magic_exam_progress_answers_fuhe'); safeRemoveItem('magic_exam_progress_wrongIds_fuhe');
                    showToast("🗑️ 已刪除此次作答紀錄！");
                } else if (resetStep === 2) {
                    setAnswers({}); setWrongIds([]); setReviewAnswers({}); setRecords([]);
                    safeClear(); showToast("💥 已清空本機所有作答與存檔紀錄！");
                }
                setShowResetModal(false); setResetStep(0);
            };

            let currentQuestions = [];
            if (activeTab === 'part1') currentQuestions = questions.filter(q => q.part === 1);
            else if (activeTab === 'part2') currentQuestions = questions.filter(q => q.part === 2);
            else if (activeTab === 'review') currentQuestions = questions.filter(q => wrongIds.includes(q.id));

            return (
                <div className="min-h-screen pb-20 relative">
                    <Header />
                    {toastMessage && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 toast-enter">
                            <div className="bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl font-bold flex items-center gap-3">
                                {toastMessage}
                            </div>
                        </div>
                    )}
                    {showResetModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                            <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl">
                                {resetStep === 0 ? (
                                    <>
                                        <h3 className="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2"><i className="fas fa-triangle-exclamation text-rose-500"></i> 砍掉重練</h3>
                                        <div className="space-y-3 mt-4">
                                            <button onClick={() => setResetStep(1)} className="w-full text-left px-5 py-4 rounded-xl bg-orange-50 text-orange-700 font-bold border border-orange-200 shadow-sm bouncy">① 僅刪除此次作答紀錄</button>
                                            <button onClick={() => setResetStep(2)} className="w-full text-left px-5 py-4 rounded-xl bg-rose-50 text-rose-700 font-bold border border-rose-200 shadow-sm bouncy">② 刪除本機所有紀錄</button>
                                            <button onClick={() => {setShowResetModal(false); setResetStep(0);}} className="w-full text-left px-5 py-4 rounded-xl bg-gray-50 text-gray-700 font-bold border border-gray-200 shadow-sm bouncy">③ 算了，不要刪了</button>
                                        </div>
                                    </>
                                ) : (
                                    <>
                                        <h3 className="text-2xl font-bold text-rose-600 mb-4"><i className="fas fa-circle-question mr-2"></i>再次確認</h3>
                                        <p className="text-gray-700 mb-8 font-medium leading-relaxed">{resetStep === 1 ? "確定要刪除「此次作答紀錄」嗎？" : "確定要刪除「本機所有紀錄」嗎？(無法復原)"}</p>
                                        <div className="flex gap-3">
                                            <button onClick={() => {setShowResetModal(false); setResetStep(0);}} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold bouncy">取消</button>
                                            <button onClick={executeReset} className="flex-1 py-3 rounded-xl bg-rose-500 text-white font-bold shadow-md bouncy">確定刪除</button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                    
                    <div className="max-w-3xl mx-auto px-4 mb-6 flex flex-wrap gap-2 md:gap-3 justify-center">
                        <button onClick={handleSaveRecord} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-indigo-50 text-indigo-700 border-2 border-indigo-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-save"></i> 紀錄存檔</button>
                        <button onClick={() => handleExport('html')} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-blue-50 text-blue-700 border-2 border-blue-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-download"></i> 匯出 (HTML)</button>
                        <button onClick={() => handleExport('pdf')} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-emerald-50 text-emerald-700 border-2 border-emerald-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-print"></i> 列印 / PDF</button>
                        <button onClick={() => {setShowResetModal(true); setResetStep(0);}} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-rose-50 text-rose-700 border-2 border-rose-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-trash-can"></i> 砍掉重練</button>
                    </div>

                    <div className="max-w-3xl mx-auto px-4 mb-8 flex flex-wrap gap-3">
                        <button onClick={() => setActiveTab('part1')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm ${activeTab === 'part1' ? 'bg-teal-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>第一部份 (1~25)</button>
                        <button onClick={() => setActiveTab('part2')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm ${activeTab === 'part2' ? 'bg-teal-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>第二部份 (26~50)</button>
                        <button onClick={() => setActiveTab('review')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm relative ${activeTab === 'review' ? 'bg-rose-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>
                            錯題複習
                            {Array.isArray(wrongIds) && wrongIds.length > 0 && (<span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2 py-1 rounded-full animate-bounce">{wrongIds.length}</span>)}
                        </button>
                        <button onClick={() => setActiveTab('history')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm ${activeTab === 'history' ? 'bg-indigo-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>歷史紀錄</button>
                    </div>

                    {activeTab === 'history' ? (
                        <div className="px-4 max-w-3xl mx-auto fade-in">
                            <h2 className="text-xl font-bold text-indigo-700 mb-6"><i className="fas fa-clock-rotate-left mr-2"></i>我的存檔紀錄</h2>
                            {records.length === 0 ? (
                                <div className="text-center py-16 bg-white rounded-3xl shadow-sm border"><p className="text-gray-500 font-medium">目前沒有存檔紀錄喔！</p></div>
                            ) : (
                                <div className="space-y-4">
                                    {[...records].reverse().map(record => (
                                        <div key={record.id} className="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-indigo-500">
                                            <div className="text-xs text-gray-400 font-bold mb-1">{record.timestamp}</div>
                                            <div className="font-extrabold text-lg text-gray-800 mb-1">第 {record.attempt} 次挑戰紀錄</div>
                                            <div className="text-sm font-medium text-gray-600">作答：{record.totalAnswered} 題 | <span className="text-green-600">答對：{record.correctCount} 題</span> | <span className="text-rose-500">答錯：{record.wrongCount} 題</span></div>
                                            {record.wrongIds && record.wrongIds.length > 0 && (<div className="mt-2 bg-rose-50 text-rose-700 px-4 py-2 rounded-xl text-sm font-bold">錯題：{record.wrongIds.join(', ')}</div>)}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    ) : activeTab === 'review' && wrongIds.length === 0 ? (
                        <div className="text-center py-20 bg-white rounded-3xl shadow-sm max-w-3xl mx-auto fade-in"><div className="text-6xl mb-4">🌟</div><h2 className="text-2xl font-bold text-teal-600">太棒了！目前沒有錯題！</h2></div>
                    ) : (
                        <div className="px-4">
                            {activeTab === 'review' && (
                                <div className="max-w-3xl mx-auto mb-6 flex justify-between items-center fade-in"><h2 className="text-xl font-bold text-rose-600"><i className="fas fa-fire mr-2"></i>錯題特訓區</h2><button onClick={() => setReviewAnswers({})} className="px-4 py-2 bg-rose-100 text-rose-700 rounded-full font-bold text-sm shadow-sm bouncy"><i className="fas fa-redo mr-1"></i> 重新測驗</button></div>
                            )}
                            {currentQuestions.map((q, idx) => (<QuestionCard key={`${activeTab}-${q.id}`} item={q} index={idx} selectedIdx={activeTab === 'review' ? reviewAnswers[q.id] : answers[q.id]} onSelect={handleSelect} isReviewMode={activeTab === 'review'} />))}
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
